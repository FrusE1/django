{% extends 'main/layout.html' %}

{% block title %}{{ article.title }}{% endblock %}

{% block content %}
    <div class="features">
        <h1>{{ article.title }}</h1>
        <p>{{ article.date }}</p>
        <p>{{ article.text }}</p>
        <div>
            <a href="{% url 'news_delete' article.id %}" class="btn btn-danger">Удалить</a>
            <a href="{% url 'news_edit' article.id %}" class="btn btn-info">Редактировать</a>
        </div>
    </div>
{% endblock %}
